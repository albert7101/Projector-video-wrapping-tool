<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projector Video Canvas</title>
    <meta name="description" content="Standalone video mapping tool for projectors. Works offline after first load.">
    <!-- Dependencies (CDNs will be cached by browser for offline use) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        body { background-color: black; margin: 0; overflow: hidden; color: white; font-family: sans-serif; }
        ::-webkit-scrollbar { display: none; }
        * { 
            scrollbar-width: none; 
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .no-select { 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-black no-select">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo } = React;
        // Framer Motion UMD exports to window.Motion
        const { motion, AnimatePresence } = window.Motion || window.FramerMotion || { 
            motion: { div: "div", button: "button" }, 
            AnimatePresence: ({children}) => children 
        };

        // --- Database Logic (IndexedDB) ---
        const DB_NAME = 'ProjectorCanvasDB';
        const STORE_NAME = 'videos';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        };

        const saveVideoToDB = async (videoData) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                // We store the Blob/File directly
                store.put(videoData);
                transaction.oncomplete = () => resolve();
                transaction.onerror = (e) => reject(e.target.error);
            });
        };

        const deleteVideoFromDB = async (id) => {
            const db = await initDB();
            const transaction = db.transaction(STORE_NAME, 'readwrite');
            transaction.objectStore(STORE_NAME).delete(id);
        };

        const getAllVideosFromDB = async () => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e.target.error);
            });
        };

        // --- Math Helper for Perspective Transform ---
        function getPerspectiveTransform(src, dst) {
            const p1 = src;
            const p2 = dst;
            const a = [
                [p1[0].x, p1[0].y, 1, 0, 0, 0, -p2[0].x * p1[0].x, -p2[0].x * p1[0].y],
                [0, 0, 0, p1[0].x, p1[0].y, 1, -p2[0].y * p1[0].x, -p2[0].y * p1[0].y],
                [p1[1].x, p1[1].y, 1, 0, 0, 0, -p2[1].x * p1[1].x, -p2[1].x * p1[1].y],
                [0, 0, 0, p1[1].x, p1[1].y, 1, -p2[1].y * p1[1].x, -p2[1].y * p1[1].y],
                [p1[2].x, p1[2].y, 1, 0, 0, 0, -p2[2].x * p1[2].x, -p2[2].x * p1[2].y],
                [0, 0, 0, p1[2].x, p1[2].y, 1, -p2[2].y * p1[2].x, -p2[2].y * p1[2].y],
                [p1[3].x, p1[3].y, 1, 0, 0, 0, -p2[3].x * p1[3].x, -p2[3].x * p1[3].y],
                [0, 0, 0, p1[3].x, p1[3].y, 1, -p2[3].y * p1[3].x, -p2[3].y * p1[3].y]
            ];
            const b = [p2[0].x, p2[0].y, p2[1].x, p2[1].y, p2[2].x, p2[2].y, p2[3].x, p2[3].y];
            const n = 8;
            for (let i = 0; i < n; i++) {
                let max = i;
                for (let j = i + 1; j < n; j++) if (Math.abs(a[j][i]) > Math.abs(a[max][i])) max = j;
                [a[i], a[max]] = [a[max], a[i]];
                [b[i], b[max]] = [b[max], b[i]];
                for (let j = i + 1; j < n; j++) {
                    const c = a[j][i] / a[i][i];
                    for (let k = i; k < n; k++) a[j][k] -= c * a[i][k];
                    b[j] -= c * b[i];
                }
            }
            const x = new Array(n);
            for (let i = n - 1; i >= 0; i--) {
                let sum = 0;
                for (let j = i + 1; j < n; j++) sum += a[i][j] * x[j];
                x[i] = (b[i] - sum) / a[i][i];
            }
            return [
                x[0], x[3], 0, x[6],
                x[1], x[4], 0, x[7],
                0, 0, 1, 0,
                x[2], x[5], 0, 1
            ];
        }

        // --- Video Player Component ---
        const VideoPlayer = ({ video, isLocked, containerRef, onRemove, onReset, onUpdate, onFocus }) => {
            const videoRef = useRef(null);
            const [isHovered, setIsHovered] = useState(false);
            const [activeHandle, setActiveHandle] = useState(null);
            const [isDraggingBody, setIsDraggingBody] = useState(false);
            const [dragData, setDragData] = useState(null);

            const { matrixStyle } = useMemo(() => {
                const srcPoints = [
                    { x: 0, y: 0 },
                    { x: video.originalWidth, y: 0 },
                    { x: video.originalWidth, y: video.originalHeight },
                    { x: 0, y: video.originalHeight }
                ];
                const m = getPerspectiveTransform(srcPoints, video.corners);
                const matrixString = `matrix3d(${m.join(',')})`;
                return { 
                    matrixStyle: {
                        transform: matrixString,
                        WebkitTransform: matrixString,
                        msTransform: matrixString,
                        MozTransform: matrixString
                    }
                };
            }, [video.corners, video.originalWidth, video.originalHeight]);

            useEffect(() => {
                if (videoRef.current) {
                    if (video.isPaused) videoRef.current.pause();
                    else videoRef.current.play().catch(() => {});
                    videoRef.current.muted = video.isMuted;
                }
            }, [video.isPaused, video.isMuted]);

            useEffect(() => {
                lucide.createIcons();
            }, [isHovered, video.isPaused, video.isMuted]);

            useEffect(() => {
                if (activeHandle === null) return;

                const onMove = (moveEvent) => {
                    const clientX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
                    const clientY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
                    const rect = containerRef.current.getBoundingClientRect();
                    const x = clientX - rect.left;
                    const y = clientY - rect.top;
                    const newCorners = [...video.corners];
                    newCorners[activeHandle] = { x, y };
                    onUpdate({ corners: newCorners });
                };

                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive: false });

                return () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('touchmove', onMove);
                };
            }, [activeHandle, video.corners, onUpdate, containerRef]);

            useEffect(() => {
                if (!isDraggingBody || !dragData) return;

                const onMove = (moveEvent) => {
                    const currentX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
                    const currentY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
                    
                    const dx = currentX - dragData.startX;
                    const dy = currentY - dragData.startY;

                    const newCorners = dragData.initialCorners.map(p => ({
                        x: p.x + dx,
                        y: p.y + dy
                    }));
                    onUpdate({ corners: newCorners });
                };

                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive: false });

                return () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('touchmove', onMove);
                };
            }, [isDraggingBody, dragData, onUpdate]);

            const handleCornerDrag = (index, e) => {
                if (isLocked) return;
                e.preventDefault();
                e.stopPropagation();
                onFocus();
                
                // If we were dragging the body, stop that first
                setIsDraggingBody(false);
                setDragData(null);
                
                // Toggle the active handle: if it's already this one, stop. Otherwise, start.
                setActiveHandle(prev => prev === index ? null : index);
            };

            const handleBodyDrag = (e) => {
                if (isLocked) return;
                e.preventDefault();
                e.stopPropagation();
                onFocus();

                // If we were dragging a corner, stop that first
                setActiveHandle(null);

                if (!isDraggingBody) {
                    const startX = e.touches ? e.touches[0].clientX : e.clientX;
                    const startY = e.touches ? e.touches[0].clientY : e.clientY;
                    setDragData({ 
                        startX, 
                        startY, 
                        initialCorners: [...video.corners] 
                    });
                    setIsDraggingBody(true);
                } else {
                    setIsDraggingBody(false);
                    setDragData(null);
                }
            };

            return (
                <div style={{ position: 'absolute', left: 0, top: 0, width: '100%', height: '100%', zIndex: video.zIndex, pointerEvents: 'none' }}
                     onMouseEnter={() => setIsHovered(true)} onMouseLeave={() => setIsHovered(false)}>
                    <div style={{ 
                            position: 'absolute', 
                            width: video.originalWidth, 
                            height: video.originalHeight, 
                            ...matrixStyle,
                            transformOrigin: '0 0', 
                            WebkitTransformOrigin: '0 0',
                            overflow: 'hidden', 
                            pointerEvents: isLocked ? 'none' : 'auto', 
                            cursor: isLocked ? 'default' : 'move' 
                         }}
                         onMouseDown={handleBodyDrag} onTouchStart={handleBodyDrag}>
                        <video ref={videoRef} src={video.url} className="w-full h-full object-fill pointer-events-none" loop muted={video.isMuted} playsInline />
                        <div className={`absolute inset-0 bg-black/40 flex flex-col justify-center items-center gap-10 transition-opacity duration-300 ${isHovered ? 'opacity-100' : 'opacity-0'}`}>
                            <div className="flex gap-8">
                                <button onClick={(e) => { e.stopPropagation(); onUpdate({ isPaused: !video.isPaused }); }} className="p-10 bg-white/20 backdrop-blur-2xl rounded-full hover:bg-white/40 transition-all active:scale-90 shadow-2xl border border-white/10">
                                    <i data-lucide={video.isPaused ? "play" : "pause"} style={{width:64, height:64, fill:'currentColor'}}></i>
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onUpdate({ isMuted: !video.isMuted }); }} className="p-10 bg-white/20 backdrop-blur-2xl rounded-full hover:bg-white/40 transition-all active:scale-90 shadow-2xl border border-white/10">
                                    <i data-lucide={video.isMuted ? "volume-x" : "volume-2"} style={{width:64, height:64}}></i>
                                </button>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={(e) => { e.stopPropagation(); onReset(); }} className="px-8 py-4 bg-zinc-800/90 hover:bg-zinc-700 rounded-2xl text-sm font-black flex items-center gap-3 transition-all active:scale-95 shadow-xl border border-zinc-700">
                                    <i data-lucide="refresh-cw" style={{width:20, height:20}}></i> RESET SHAPE
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onRemove(); }} className="px-8 py-4 bg-red-600/90 hover:bg-red-500 rounded-2xl text-sm font-black flex items-center gap-3 transition-all active:scale-95 shadow-xl border border-red-500">
                                    <i data-lucide="trash-2" style={{width:20, height:20}}></i> REMOVE
                                </button>
                            </div>
                        </div>
                    </div>
                    {!isLocked && video.corners.map((p, i) => (
                        <div key={i} onMouseDown={(e) => handleCornerDrag(i, e)} onTouchStart={(e) => handleCornerDrag(i, e)}
                             style={{ position: 'absolute', left: p.x, top: p.y, width: 44, height: 44, transform: 'translate(-50%, -50%)', zIndex: video.zIndex + 10, cursor: 'crosshair', pointerEvents: 'auto' }}
                             className={`group flex items-center justify-center transition-opacity ${isHovered || activeHandle === i ? 'opacity-100' : 'opacity-0'}`}>
                            <div className={`w-6 h-6 rounded-full border-2 border-white shadow-lg transition-all ${activeHandle === i ? 'scale-150 bg-amber-500 border-amber-500' : 'bg-white group-hover:scale-125'}`} />
                        </div>
                    ))}
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [videos, setVideos] = useState([]);
            const [nextZIndex, setNextZIndex] = useState(1);
            const [isLocked, setIsLocked] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [isToolbarVisible, setIsToolbarVisible] = useState(true);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const fileInputRef = useRef(null);
            const containerRef = useRef(null);

            // Load saved videos on mount
            useEffect(() => {
                const loadSaved = async () => {
                    try {
                        const saved = await getAllVideosFromDB();
                        if (saved && saved.length > 0) {
                            const restored = saved.map(v => ({
                                ...v,
                                url: URL.createObjectURL(v.fileBlob) // Re-create temporary URL from stored Blob
                            }));
                            setVideos(restored);
                            const maxZ = Math.max(...restored.map(v => v.zIndex), 0);
                            setNextZIndex(maxZ + 1);
                        }
                    } catch (err) {
                        console.error("Failed to load saved videos:", err);
                    } finally {
                        setIsInitialLoading(false);
                    }
                };
                loadSaved();
            }, []);

            useEffect(() => {
                lucide.createIcons();
            }, [videos, isLocked, isFullscreen, isToolbarVisible, isInitialLoading]);

            const handleFileUpload = (event) => {
                const files = event.target.files;
                if (!files) return;
                Array.from(files).forEach((file) => {
                    if (file.type.startsWith('video/')) {
                        const videoElement = document.createElement('video');
                        const objectUrl = URL.createObjectURL(file);
                        videoElement.src = objectUrl;
                        videoElement.onloadedmetadata = () => {
                            const w = videoElement.videoWidth / 2;
                            const h = videoElement.videoHeight / 2;
                            const centerX = window.innerWidth / 2;
                            const centerY = window.innerHeight / 2;
                            const videoId = Math.random().toString(36).substr(2, 9);
                            
                            const newVideo = {
                                id: videoId,
                                fileBlob: file, // Store the actual file data
                                corners: [
                                    { x: centerX - w/2, y: centerY - h/2 },
                                    { x: centerX + w/2, y: centerY - h/2 },
                                    { x: centerX + w/2, y: centerY + h/2 },
                                    { x: centerX - w/2, y: centerY + h/2 }
                                ],
                                zIndex: nextZIndex,
                                isPaused: false,
                                isMuted: true,
                                originalWidth: videoElement.videoWidth,
                                originalHeight: videoElement.videoHeight
                            };

                            setVideos(prev => {
                                const updated = [...prev, { ...newVideo, url: objectUrl }];
                                saveVideoToDB(newVideo); // Persist to IndexedDB
                                return updated;
                            });
                            setNextZIndex(prev => prev + 1);
                        };
                    }
                });
            };

            const updateVideo = (id, updates) => {
                setVideos(prev => {
                    const updated = prev.map(v => {
                        if (v.id === id) {
                            const newVideo = { ...v, ...updates };
                            // Persist changes (excluding the temporary URL)
                            const { url, ...toSave } = newVideo;
                            saveVideoToDB(toSave);
                            return newVideo;
                        }
                        return v;
                    });
                    return updated;
                });
            };

            const removeVideo = (id) => {
                setVideos(prev => {
                    const video = prev.find(v => v.id === id);
                    if (video) URL.revokeObjectURL(video.url);
                    deleteVideoFromDB(id);
                    return prev.filter(v => v.id !== id);
                });
            };

            const clearAll = () => {
                if (confirm('Clear all videos and saved data?')) {
                    videos.forEach(v => URL.revokeObjectURL(v.url));
                    setVideos([]);
                    // Clear DB
                    initDB().then(db => {
                        const transaction = db.transaction(STORE_NAME, 'readwrite');
                        transaction.objectStore(STORE_NAME).clear();
                    });
                }
            };

            const toggleFullscreen = () => {
                const el = containerRef.current;
                if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                    if (el.requestFullscreen) el.requestFullscreen();
                    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
                    else if (el.msRequestFullscreen) el.msRequestFullscreen();
                    setIsFullscreen(true);
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                    setIsFullscreen(false);
                }
            };

            return (
                <div ref={containerRef} className="relative w-full h-screen bg-black overflow-hidden font-sans text-white select-none"
                     onClick={() => setIsToolbarVisible(!isToolbarVisible)}>
                    {videos.length === 0 && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-zinc-500 gap-6 pointer-events-none">
                            <div className="w-24 h-24 rounded-full bg-zinc-900 flex items-center justify-center border border-zinc-800 animate-pulse">
                                <i data-lucide="upload" style={{width:40, height:40}}></i>
                            </div>
                            <div className="text-center">
                                <h2 className="text-xl font-bold text-zinc-300 mb-2">Projector Video Canvas</h2>
                                <p className="text-sm max-w-xs opacity-60">Click anywhere to toggle tools. Drag corners to warp videos.</p>
                            </div>
                        </div>
                    )}
                    {videos.map(video => (
                        <VideoPlayer key={video.id} video={video} isLocked={isLocked} containerRef={containerRef}
                            onFocus={() => {
                                const maxZ = Math.max(...videos.map(v => v.zIndex), 0) + 1;
                                updateVideo(video.id, { zIndex: maxZ });
                                setNextZIndex(maxZ + 1);
                            }}
                            onRemove={() => removeVideo(video.id)}
                            onReset={() => {
                                const w = video.originalWidth / 2;
                                const h = video.originalHeight / 2;
                                const centerX = window.innerWidth / 2;
                                const centerY = window.innerHeight / 2;
                                updateVideo(video.id, { corners: [
                                    { x: centerX - w/2, y: centerY - h/2 }, { x: centerX + w/2, y: centerY - h/2 },
                                    { x: centerX + w/2, y: centerY + h/2 }, { x: centerX - w/2, y: centerY + h/2 }
                                ]});
                            }}
                            onUpdate={(updates) => updateVideo(video.id, updates)}
                        />
                    ))}
                    <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept="video/mp4" multiple className="hidden" />
                    <AnimatePresence>
                        {isToolbarVisible && (
                            <motion.div 
                                initial={{ y: 100, x: '-50%', opacity: 0 }}
                                animate={{ y: 0, x: '-50%', opacity: 1 }}
                                exit={{ y: 100, x: '-50%', opacity: 0 }}
                                style={{ left: '50%' }}
                                onClick={(e) => e.stopPropagation()}
                                className="absolute bottom-8 flex items-center gap-4 bg-zinc-900/90 backdrop-blur-xl border border-zinc-800 p-4 rounded-3xl shadow-2xl z-[9999]"
                            >
                                <button onClick={() => fileInputRef.current.click()} className="p-3 bg-white text-black rounded-2xl hover:bg-zinc-200 transition-all active:scale-90 shadow-lg">
                                    <i data-lucide="plus" style={{width:24, height:24}}></i>
                                </button>
                                <button onClick={() => setIsLocked(!isLocked)} className={`p-3 rounded-2xl transition-all active:scale-90 ${isLocked ? 'bg-amber-500 text-black' : 'bg-zinc-800 text-zinc-400 hover:text-white'}`}>
                                    <i data-lucide={isLocked ? "lock" : "unlock"} style={{width:24, height:24}}></i>
                                </button>
                                <button onClick={clearAll} className="p-3 bg-zinc-800 text-zinc-400 hover:bg-red-500 hover:text-white rounded-2xl transition-all active:scale-90">
                                    <i data-lucide="trash-2" style={{width:24, height:24}}></i>
                                </button>
                                <button onClick={toggleFullscreen} className={`p-3 rounded-2xl transition-all active:scale-90 ${isFullscreen ? 'bg-zinc-100 text-black' : 'bg-zinc-800 text-zinc-400 hover:text-white'}`}>
                                    <i data-lucide="maximize-2" style={{width:24, height:24}}></i>
                                </button>
                                <div className="h-8 w-[1px] bg-zinc-700 mx-2" />
                                <div className="flex flex-col items-center px-2">
                                    <span className="text-[10px] text-zinc-500 font-black uppercase tracking-widest leading-none mb-1">Active</span>
                                    <span className="text-xl font-mono font-bold leading-none">{videos.length}</span>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Forcibly unregister any existing service workers to fix caching issues
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let registration of registrations) registration.unregister();
            });
        }
    </script>
</body>
</html>
