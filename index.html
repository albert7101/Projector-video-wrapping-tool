<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projector Media Canvas (Lite)</title>
    <style>
        :root { --bg: #000; --accent: #f59e0b; --zinc-900: #18181b; --zinc-800: #27272a; --zinc-700: #3f3f46; --zinc-400: #a1a1aa; }
        body { background: var(--bg); margin: 0; overflow: hidden; color: white; font-family: system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        #canvas { position: relative; width: 100vw; height: 100vh; }
        .media-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; contain: layout paint style; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .media-content { display: block; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .media-container:hover .overlay { opacity: 1; pointer-events: auto; }
        .handle { position: absolute; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: crosshair; transform: translate(-50%, -50%); z-index: 100; opacity: 0; transition: opacity 0.2s; }
        .handle::after { content: ''; width: 12px; height: 12px; background: white; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: transform 0.2s; }
        .handle:hover::after, .handle.active::after { transform: scale(1.5); background: var(--accent); border-color: var(--accent); }
        .media-container:hover ~ .handle, .handle.active { opacity: 1; }
        
        #toolbar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(24,24,27,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--zinc-800); padding: 12px; border-radius: 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 1000; transition: transform 0.3s, opacity 0.3s; }
        #toolbar.hidden { transform: translate(-50%, 100px); opacity: 0; }
        
        .btn { background: var(--zinc-800); color: var(--zinc-400); border: none; padding: 12px; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn:hover { color: white; background: var(--zinc-700); }
        .btn:active { transform: scale(0.9); }
        .btn-primary { background: white; color: black; font-weight: bold; padding: 12px 20px; gap: 8px; }
        .btn-primary:hover { background: #e4e4e7; }
        .btn.active { background: var(--accent); color: black; }
        
        .divider { width: 1px; height: 30px; background: var(--zinc-700); margin: 0 4px; }
        .stats { display: flex; flex-direction: column; align-items: center; padding: 0 8px; }
        .stats-label { font-size: 9px; text-transform: uppercase; color: var(--zinc-700); font-weight: 900; letter-spacing: 1px; }
        .stats-val { font-size: 18px; font-weight: bold; font-family: monospace; }
        
        #empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--zinc-700); pointer-events: none; text-align: center; }
        .upload-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--zinc-900); border: 1px solid var(--zinc-800); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        
        .control-btn { padding: 20px; background: rgba(39,39,42,0.92); border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; color: white; cursor: pointer; transition: background 0.2s, transform 0.2s; }
        .control-btn:hover { background: rgba(255,255,255,0.2); }
        .action-btn { padding: 10px 20px; background: var(--zinc-800); border: 1px solid var(--zinc-700); border-radius: 12px; color: white; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .action-btn:hover { background: var(--zinc-700); }
        .action-btn.danger { background: rgba(220,38,38,0.8); border-color: #dc2626; }
    </style>
</head>
<body>
    <div id="canvas"></div>
    
    <div id="empty-state">
        <div class="upload-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <h2 style="margin:0; color: #d4d4d8;">Projector Media Canvas (Lite)</h2>
        <p style="font-size: 14px; opacity: 0.5;">Click anywhere to toggle tools. Optimized for performance.</p>
    </div>

    <div id="toolbar">
        <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            ADD MEDIA
        </button>
        <div class="divider"></div>
        <button id="lock-btn" class="btn" title="Lock Layout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </button>
        <button class="btn" onclick="clearAll()" title="Clear All">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
        <button id="fs-btn" class="btn" title="Toggle Fullscreen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <div class="divider"></div>
        <div class="stats">
            <span class="stats-label">Active</span>
            <span id="count" class="stats-val">0</span>
        </div>
    </div>

    <input type="file" id="file-input" hidden multiple accept="video/mp4,image/*">

    <script>
        // --- State ---
        let videos = [];
        let isLocked = false;
        let activeHandle = null; // { videoId, cornerIndex }
        let activeBody = null; // videoId
        let dragData = null;
        let nextZIndex = 1;
        let interactionFrame = 0;
        let pendingPointer = null;
        let metadataSaveTimer = 0;
        const metadataSaveQueue = new Map();

        const canvas = document.getElementById('canvas');
        const toolbar = document.getElementById('toolbar');
        const countEl = document.getElementById('count');
        const lockBtn = document.getElementById('lock-btn');
        const emptyState = document.getElementById('empty-state');

        // --- DB ---
        const DB_NAME = 'ProjectorCanvasDB_Lite';
        const STORE_NAME = 'media';
        const FILE_STORE_NAME = 'files';
        const DB_VERSION = 2;
        let dbPromise;

        const initDB = () => {
            if (dbPromise) return dbPromise;
            dbPromise = new Promise((res, rej) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = e => {
                    const db = e.target.result;
                    const tx = e.target.transaction;
                    const mediaStore = db.objectStoreNames.contains(STORE_NAME)
                        ? tx.objectStore(STORE_NAME)
                        : db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    const fileStore = db.objectStoreNames.contains(FILE_STORE_NAME)
                        ? tx.objectStore(FILE_STORE_NAME)
                        : db.createObjectStore(FILE_STORE_NAME, { keyPath: 'id' });

                    // Migrate older records so layout changes no longer rewrite
                    // the complete video/image blob.
                    if (e.oldVersion < 2) {
                        mediaStore.openCursor().onsuccess = event => {
                            const cursor = event.target.result;
                            if (!cursor) return;
                            const record = cursor.value;
                            if (record.fileBlob) {
                                fileStore.put({ id: record.id, blob: record.fileBlob });
                                delete record.fileBlob;
                                cursor.update(record);
                            }
                            cursor.continue();
                        };
                    }
                };
                req.onsuccess = e => {
                    const db = e.target.result;
                    db.onversionchange = () => db.close();
                    res(db);
                };
                req.onerror = e => {
                    dbPromise = null;
                    rej(e.target.error);
                };
            });
            return dbPromise;
        };

        const requestResult = req => new Promise((res, rej) => {
            req.onsuccess = () => res(req.result);
            req.onerror = () => rej(req.error);
        });

        const transactionDone = tx => new Promise((res, rej) => {
            tx.oncomplete = () => res();
            tx.onerror = () => rej(tx.error);
            tx.onabort = () => rej(tx.error || new Error('Storage transaction aborted'));
        });

        const serializeMedia = v => {
            const { url, fileBlob, renderW, renderH, isInViewport, ...data } = v;
            return data;
        };

        // A small synchronous journal survives closing the tab before IndexedDB commits.
        const layoutJournalKey = 'projector-layout-journal-v1';
        let layoutJournal = {};
        try { layoutJournal = JSON.parse(localStorage.getItem(layoutJournalKey) || '{}'); } catch {}
        function writeLayoutJournal() {
            try { localStorage.setItem(layoutJournalKey, JSON.stringify(layoutJournal)); }
            catch (error) { console.error('Could not back up layout', error); }
        }

        const flushMetadataSaves = async () => {
            if (!metadataSaveQueue.size) return;
            const records = Array.from(metadataSaveQueue.values()).map(serializeMedia);
            metadataSaveQueue.clear();
            clearTimeout(metadataSaveTimer);
            metadataSaveTimer = 0;
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            records.forEach(record => store.put(record));
            await transactionDone(tx);
        };

        const saveToDB = v => {
            if (!v) return;
            layoutJournal[v.id] = { corners: v.corners.map(c => ({ ...c })), zIndex: v.zIndex };
            writeLayoutJournal();
            metadataSaveQueue.set(v.id, v);
            if (!metadataSaveTimer) metadataSaveTimer = setTimeout(flushMetadataSaves, 180);
        };

        const saveNewMediaToDB = async v => {
            if (!v.fileBlob) throw new Error('Missing media file');
            const db = await initDB();
            const tx = db.transaction([STORE_NAME, FILE_STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).put(serializeMedia(v));
            tx.objectStore(FILE_STORE_NAME).put({ id: v.id, blob: v.fileBlob });
            await transactionDone(tx);
        };

        const getFileFromDB = async (db, id) => {
            const tx = db.transaction(FILE_STORE_NAME, 'readonly');
            const record = await requestResult(tx.objectStore(FILE_STORE_NAME).get(id));
            return record && record.blob;
        };

        const deleteFromDB = async id => {
            const db = await initDB();
            const tx = db.transaction([STORE_NAME, FILE_STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).delete(id);
            tx.objectStore(FILE_STORE_NAME).delete(id);
            await transactionDone(tx);
        };

        // --- Math ---
        function getPerspectiveTransform(src, dst) {
            const p1 = src, p2 = dst;
            const a = [
                [p1[0].x, p1[0].y, 1, 0, 0, 0, -p2[0].x * p1[0].x, -p2[0].x * p1[0].y],
                [0, 0, 0, p1[0].x, p1[0].y, 1, -p2[0].y * p1[0].x, -p2[0].y * p1[0].y],
                [p1[1].x, p1[1].y, 1, 0, 0, 0, -p2[1].x * p1[1].x, -p2[1].x * p1[1].y],
                [0, 0, 0, p1[1].x, p1[1].y, 1, -p2[1].y * p1[1].x, -p2[1].y * p1[1].y],
                [p1[2].x, p1[2].y, 1, 0, 0, 0, -p2[2].x * p1[2].x, -p2[2].x * p1[2].y],
                [0, 0, 0, p1[2].x, p1[2].y, 1, -p2[2].y * p1[2].x, -p2[2].y * p1[2].y],
                [p1[3].x, p1[3].y, 1, 0, 0, 0, -p2[3].x * p1[3].x, -p2[3].x * p1[3].y],
                [0, 0, 0, p1[3].x, p1[3].y, 1, -p2[3].y * p1[3].x, -p2[3].y * p1[3].y]
            ];
            const b = [p2[0].x, p2[0].y, p2[1].x, p2[1].y, p2[2].x, p2[2].y, p2[3].x, p2[3].y];
            const n = 8;
            for (let i = 0; i < n; i++) {
                let max = i;
                for (let j = i + 1; j < n; j++) if (Math.abs(a[j][i]) > Math.abs(a[max][i])) max = j;
                if (Math.abs(a[max][i]) < 1e-8) return null;
                [a[i], a[max]] = [a[max], a[i]]; [b[i], b[max]] = [b[max], b[i]];
                for (let j = i + 1; j < n; j++) {
                    const c = a[j][i] / a[i][i];
                    for (let k = i; k < n; k++) a[j][k] -= c * a[i][k];
                    b[j] -= c * b[i];
                }
            }
            const x = new Array(n);
            for (let i = n - 1; i >= 0; i--) {
                let sum = 0;
                for (let j = i + 1; j < n; j++) sum += a[i][j] * x[j];
                x[i] = (b[i] - sum) / a[i][i];
            }
            const matrix = [x[0], x[3], 0, x[6], x[1], x[4], 0, x[7], 0, 0, 1, 0, x[2], x[5], 0, 1];
            return matrix.every(Number.isFinite) ? matrix : null;
        }

        // --- Rendering ---
        function getRenderSize(w, h) {
            const maxDimension = 1920;
            const maxPixels = 1920 * 1080;
            const dimensionScale = Math.min(1, maxDimension / Math.max(w, h));
            const pixelScale = Math.min(1, Math.sqrt(maxPixels / (w * h)));
            const scale = Math.min(dimensionScale, pixelScale);
            return {
                width: Math.max(1, Math.round(w * scale)),
                height: Math.max(1, Math.round(h * scale))
            };
        }

        function updateMediaStyles(v) {
            const el = document.getElementById(`container-${v.id}`);
            if (!el) return;
            const renderW = v.renderW || v.w;
            const renderH = v.renderH || v.h;
            const srcPoints = [{x:0,y:0}, {x:renderW,y:0}, {x:renderW,y:renderH}, {x:0,y:renderH}];
            const m = getPerspectiveTransform(srcPoints, v.corners);
            if (!m) return;
            const matrix = `matrix3d(${m.join(',')})`;
            el.style.transform = matrix;
            el.style.webkitTransform = matrix;
            el.style.zIndex = v.zIndex;
            
            v.corners.forEach((p, i) => {
                const h = document.getElementById(`handle-${v.id}-${i}`);
                if (h) { h.style.left = p.x + 'px'; h.style.top = p.y + 'px'; h.style.zIndex = v.zIndex + 1; }
            });
        }

        const videoStartQueue = [];
        let videoStartQueueRunning = false;

        function queueVideoStart(v, content) {
            if (v.isPaused || content.dataset.playQueued === 'true' || content.dataset.failed === 'true') return;
            content.dataset.playQueued = 'true';
            videoStartQueue.push({ v, content });
            if (!videoStartQueueRunning) runVideoStartQueue();
        }

        async function runVideoStartQueue() {
            videoStartQueueRunning = true;
            while (videoStartQueue.length) {
                const { v, content } = videoStartQueue.shift();
                content.dataset.playQueued = 'false';
                if (!document.hidden && !v.isPaused && document.contains(content)) {
                    await content.play().catch(() => {});
                    await new Promise(resolve => setTimeout(resolve, 250));
                }
            }
            videoStartQueueRunning = false;
        }

        function clearActiveInteraction(videoId) {
            if (pendingPointer) {
                cancelAnimationFrame(interactionFrame);
                applyPendingInteraction();
            }
            if (activeHandle) saveToDB(videos.find(v => v.id === activeHandle.videoId));
            if (activeBody) saveToDB(videos.find(v => v.id === activeBody));
            if (activeHandle && (!videoId || activeHandle.videoId === videoId)) {
                const handle = document.getElementById(`handle-${activeHandle.videoId}-${activeHandle.cornerIndex}`);
                if (handle) handle.classList.remove('active');
                activeHandle = null;
            }
            if (!videoId || activeBody === videoId) {
                activeBody = null;
                dragData = null;
            }
            pendingPointer = null;
            if (interactionFrame) {
                cancelAnimationFrame(interactionFrame);
                interactionFrame = 0;
            }
        }

        function createMediaElement(v) {
            if (document.getElementById(`container-${v.id}`)) return;
            const renderSize = getRenderSize(v.w, v.h);
            v.renderW = renderSize.width;
            v.renderH = renderSize.height;

            const container = document.createElement('div');
            container.id = `container-${v.id}`;
            container.className = 'media-container';
            container.style.width = v.renderW + 'px';
            container.style.height = v.renderH + 'px';
            
            const content = document.createElement(v.type === 'video' ? 'video' : 'img');
            content.className = 'media-content';
            if (v.type === 'video') {
                content.loop = true;
                content.muted = v.isMuted;
                content.playsInline = true;
                content.autoplay = true;
                content.preload = 'auto';
            } else {
                content.decoding = 'async';
            }
            content.onerror = () => {
                content.dataset.failed = 'true';
                if (v.type === 'video') content.pause();
            };
            content.src = v.url;
            if (v.type === 'video' && !v.isPaused) {
                content.addEventListener('loadeddata', () => queueVideoStart(v, content), { once: true });
                content.addEventListener('canplay', () => queueVideoStart(v, content), { once: true });
            }
            
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            
            const controls = document.createElement('div');
            controls.style.display = 'flex';
            controls.style.gap = '20px';
            
            if (v.type === 'video') {
                const playBtn = document.createElement('button');
                playBtn.className = 'control-btn';
                playBtn.innerHTML = v.isPaused ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>' : '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
                playBtn.onclick = e => { e.stopPropagation(); v.isPaused = !v.isPaused; v.isPaused ? content.pause() : content.play().catch(() => {}); playBtn.innerHTML = v.isPaused ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>' : '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'; saveToDB(v); };
                
                const muteBtn = document.createElement('button');
                muteBtn.className = 'control-btn';
                muteBtn.innerHTML = v.isMuted ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>' : '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
                muteBtn.onclick = e => { e.stopPropagation(); v.isMuted = !v.isMuted; content.muted = v.isMuted; muteBtn.innerHTML = v.isMuted ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>' : '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>'; saveToDB(v); };
                
                controls.append(playBtn, muteBtn);
            }
            
            const actions = document.createElement('div');
            actions.style.display = 'flex';
            actions.style.gap = '10px';
            
            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.innerHTML = 'RESET';
            resetBtn.onclick = e => { 
                e.stopPropagation(); 
                const aspectRatio = v.w / v.h;
                let targetW = window.innerWidth / 4;
                let targetH = targetW / aspectRatio;
                if (targetH > window.innerHeight / 4) {
                    targetH = window.innerHeight / 4;
                    targetW = targetH * aspectRatio;
                }
                const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
                const sw = targetW / 2, sh = targetH / 2;
                v.corners = [
                    { x: cx - sw, y: cy - sh },
                    { x: cx + sw, y: cy - sh },
                    { x: cx + sw, y: cy + sh },
                    { x: cx - sw, y: cy + sh }
                ];
                updateMediaStyles(v); 
                saveToDB(v); 
            };
            
            const delBtn = document.createElement('button');
            delBtn.className = 'action-btn danger';
            delBtn.innerHTML = 'REMOVE';
            delBtn.onclick = e => {
                e.stopPropagation();
                if (content.tagName === 'VIDEO') {
                    content.pause();
                    content.removeAttribute('src');
                    content.load();
                }
                URL.revokeObjectURL(v.url);
                clearActiveInteraction(v.id);
                container.remove();
                v.corners.forEach((_,i) => document.getElementById(`handle-${v.id}-${i}`)?.remove());
                videos = videos.filter(x => x.id !== v.id);
                metadataSaveQueue.delete(v.id);
                delete layoutJournal[v.id];
                writeLayoutJournal();
                deleteFromDB(v.id);
                updateCount();
            };
            
            actions.append(resetBtn, delBtn);
            overlay.append(controls, actions);
            container.append(content, overlay);
            
            container.onmousedown = container.ontouchstart = e => {
                if (e.target.closest('button')) return;
                if (isLocked) return;
                e.stopPropagation();
                v.zIndex = nextZIndex++;
                updateMediaStyles(v);
                const isSameBody = activeBody === v.id;
                clearActiveInteraction();
                if (!isSameBody) {
                    activeBody = v.id;
                    const p = e.touches ? e.touches[0] : e;
                    dragData = { startX: p.clientX, startY: p.clientY, initialCorners: v.corners.map(c => ({...c})) };
                }
            };
            
            canvas.appendChild(container);
            
            v.corners.forEach((p, i) => {
                const h = document.createElement('div');
                h.id = `handle-${v.id}-${i}`;
                h.className = 'handle';
                h.onmousedown = h.ontouchstart = e => {
                    if (isLocked) return;
                    e.stopPropagation();
                    v.zIndex = nextZIndex++;
                    updateMediaStyles(v);
                    const isSameHandle = activeHandle && activeHandle.videoId === v.id && activeHandle.cornerIndex === i;
                    clearActiveInteraction();
                    if (!isSameHandle) {
                        activeHandle = { videoId: v.id, cornerIndex: i };
                        h.classList.add('active');
                    }
                };
                canvas.appendChild(h);
            });
            
            updateMediaStyles(v);
        }

        // --- Interactions ---
        function applyPendingInteraction() {
            interactionFrame = 0;
            if (!pendingPointer) return;
            const p = pendingPointer;
            pendingPointer = null;

            if (activeHandle) {
                const v = videos.find(x => x.id === activeHandle.videoId);
                if (!v) return clearActiveInteraction();
                v.corners[activeHandle.cornerIndex] = { x: p.x, y: p.y };
                updateMediaStyles(v);
                saveToDB(v);
            } else if (activeBody && dragData) {
                const v = videos.find(x => x.id === activeBody);
                if (!v) return clearActiveInteraction();
                const dx = p.x - dragData.startX;
                const dy = p.y - dragData.startY;
                v.corners = dragData.initialCorners.map(c => ({ x: c.x + dx, y: c.y + dy }));
                updateMediaStyles(v);
                saveToDB(v);
            }
        }

        window.onmousemove = window.ontouchmove = e => {
            if (isLocked || (!activeHandle && !activeBody)) return;
            const p = e.touches ? e.touches[0] : e;
            pendingPointer = { x: p.clientX, y: p.clientY };
            if (!interactionFrame) interactionFrame = requestAnimationFrame(applyPendingInteraction);
        };

        window.onmouseup = window.ontouchend = () => {
            if (pendingPointer) {
                cancelAnimationFrame(interactionFrame);
                applyPendingInteraction();
            }
            if (activeHandle) saveToDB(videos.find(x => x.id === activeHandle.videoId));
            if (activeBody) saveToDB(videos.find(x => x.id === activeBody));
        };

        document.body.onclick = () => toolbar.classList.toggle('hidden');
        toolbar.onclick = e => e.stopPropagation();

        function updateCount() {
            countEl.innerText = videos.length;
            emptyState.style.display = videos.length ? 'none' : 'flex';
        }

        function clearAll() {
            if (!confirm('Clear all?')) return;
            clearActiveInteraction();
            videos.forEach(v => {
                const container = document.getElementById(`container-${v.id}`);
                if (!container) return;
                const content = container.querySelector('.media-content');
                if (content.tagName === 'VIDEO') {
                    content.pause();
                    content.removeAttribute('src');
                    content.load();
                }
                URL.revokeObjectURL(v.url);
                container.remove();
                v.corners.forEach((_,i) => document.getElementById(`handle-${v.id}-${i}`)?.remove());
            });
            videos = [];
            layoutJournal = {};
            writeLayoutJournal();
            metadataSaveQueue.clear();
            clearTimeout(metadataSaveTimer);
            metadataSaveTimer = 0;
            initDB().then(db => {
                const tx = db.transaction([STORE_NAME, FILE_STORE_NAME], 'readwrite');
                tx.objectStore(STORE_NAME).clear();
                tx.objectStore(FILE_STORE_NAME).clear();
            });
            updateCount();
        }

        lockBtn.onclick = () => { isLocked = !isLocked; lockBtn.classList.toggle('active', isLocked); };

        document.getElementById('fs-btn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        // --- File Handling ---
        function readMediaDimensions(file, url, isVideo) {
            return new Promise((resolve, reject) => {
                const probe = document.createElement(isVideo ? 'video' : 'img');
                let timeoutId;
                const cleanup = () => {
                    clearTimeout(timeoutId);
                    probe.onload = null;
                    probe.onerror = null;
                    probe.onloadedmetadata = null;
                    if (isVideo) probe.pause();
                    probe.removeAttribute('src');
                    if (isVideo) probe.load();
                };
                const fail = () => {
                    cleanup();
                    reject(new Error(`Could not load ${file.name}`));
                };
                const loaded = () => {
                    const w = isVideo ? probe.videoWidth : probe.naturalWidth;
                    const h = isVideo ? probe.videoHeight : probe.naturalHeight;
                    cleanup();
                    if (!w || !h) return reject(new Error(`Invalid dimensions for ${file.name}`));
                    resolve({ w, h });
                };
                timeoutId = setTimeout(fail, 15000);
                probe.onerror = fail;
                if (isVideo) {
                    probe.preload = 'metadata';
                    probe.onloadedmetadata = loaded;
                } else {
                    probe.decoding = 'async';
                    probe.onload = loaded;
                }
                probe.src = url;
            });
        }

        async function optimizeImageBlob(file, w, h) {
            const supportedType = /^(image\/jpeg|image\/png|image\/webp)$/i.test(file.type);
            const target = getRenderSize(w, h);
            if (!supportedType || (target.width === w && target.height === h) || !window.createImageBitmap) return file;

            let bitmap;
            try {
                bitmap = await createImageBitmap(file, {
                    resizeWidth: target.width,
                    resizeHeight: target.height,
                    resizeQuality: 'high'
                });
                const canvasEl = document.createElement('canvas');
                canvasEl.width = target.width;
                canvasEl.height = target.height;
                canvasEl.getContext('2d', { alpha: true }).drawImage(bitmap, 0, 0, target.width, target.height);
                const optimized = await new Promise(resolve => canvasEl.toBlob(resolve, 'image/webp', 0.9));
                canvasEl.width = canvasEl.height = 1;
                return optimized || file;
            } catch {
                return file;
            } finally {
                if (bitmap) bitmap.close();
            }
        }

        // Compare sampled bytes without loading large videos into memory.
        async function mediaFingerprint(blob) {
            const size = 65536;
            const chunks = [];
            for (const offset of new Set([0, Math.max(0, Math.floor(blob.size / 2) - size / 2), Math.max(0, blob.size - size)])) {
                chunks.push(await blob.slice(offset, offset + size).arrayBuffer());
            }
            const bytes = await new Blob(chunks).arrayBuffer();
            const digest = await crypto.subtle.digest('SHA-256', bytes);
            return `${blob.size}:${Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('')}`;
        }

        async function addMediaFile(file) {
            const fingerprint = await mediaFingerprint(file);
            if (videos.some(v => v.fingerprint === fingerprint)) return;
            const isVideo = file.type.startsWith('video/');
            let workingBlob = file;
            let optimizedImage = false;
            let url = URL.createObjectURL(workingBlob);
            try {
                const { w, h } = await readMediaDimensions(file, url, isVideo);
                if (!isVideo) {
                    workingBlob = await optimizeImageBlob(file, w, h);
                    if (workingBlob !== file) {
                        optimizedImage = true;
                        URL.revokeObjectURL(url);
                        url = URL.createObjectURL(workingBlob);
                    }
                }

                const aspectRatio = w / h;
                let targetW = window.innerWidth / 4;
                let targetH = targetW / aspectRatio;
                if (targetH > window.innerHeight / 4) {
                    targetH = window.innerHeight / 4;
                    targetW = targetH * aspectRatio;
                }

                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;
                const sw = targetW / 2;
                const sh = targetH / 2;
                const v = {
                    id: Math.random().toString(36).substr(2,9),
                    type: isVideo ? 'video' : 'image',
                    fileBlob: workingBlob,
                    corners: [
                        { x: cx - sw, y: cy - sh },
                        { x: cx + sw, y: cy - sh },
                        { x: cx + sw, y: cy + sh },
                        { x: cx - sw, y: cy + sh }
                    ],
                    zIndex: nextZIndex++,
                    isPaused: false,
                    isMuted: true,
                    optimizedImage,
                    fingerprint,
                    w, h, url
                };

                await saveNewMediaToDB(v);
                v.fileBlob = null;
                videos.push(v);
                createMediaElement(v);
                updateCount();
            } catch (error) {
                URL.revokeObjectURL(url);
                console.error(error);
            }
        }

        document.getElementById('file-input').onchange = async e => {
            const input = e.target;
            const files = Array.from(input.files);
            input.disabled = true;
            try {
                await restoreReady;
                for (const file of files) await addMediaFile(file);
            } finally {
                input.disabled = false;
                input.value = '';
            }
        };

        // --- Init ---
        const restoreReady = (async () => {
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, 'readonly');
            const saved = await requestResult(tx.objectStore(STORE_NAME).getAll());
            for (const v of saved) {
                let blob = await getFileFromDB(db, v.id);
                if (!blob) continue;
                if (layoutJournal[v.id]) Object.assign(v, layoutJournal[v.id]);
                v.fingerprint = v.fingerprint || await mediaFingerprint(blob);
                // Keep separately positioned copies; remove only identical overlaps.
                if (videos.some(existing => existing.fingerprint === v.fingerprint &&
                    JSON.stringify(existing.corners) === JSON.stringify(v.corners))) {
                    await deleteFromDB(v.id);
                    delete layoutJournal[v.id];
                    writeLayoutJournal();
                    continue;
                }
                if (v.type === 'image' && !v.optimizedImage) {
                    const optimized = await optimizeImageBlob(blob, v.w, v.h);
                    if (optimized !== blob) {
                        blob = optimized;
                        v.optimizedImage = true;
                        v.fileBlob = blob;
                        await saveNewMediaToDB(v);
                        v.fileBlob = null;
                    }
                }
                v.url = URL.createObjectURL(blob);
                videos.push(v);
                saveToDB(v);
                createMediaElement(v);
                if (v.zIndex >= nextZIndex) nextZIndex = v.zIndex + 1;
                updateCount();
                await new Promise(resolve => requestAnimationFrame(resolve));
            }
            updateCount();
        })();

        // Stop decoding in the background, then resume only media that the user
        // left playing when the page becomes visible again.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearActiveInteraction();
                flushMetadataSaves().catch(console.error);
            }
            videos.forEach(v => {
                if (v.type !== 'video') return;
                const content = document.querySelector(`#container-${v.id} video`);
                if (!content) return;
                if (document.hidden) {
                    content.pause();
                } else if (!v.isPaused) {
                    queueVideoStart(v, content);
                }
            });
        });

        window.addEventListener('pagehide', () => {
            clearActiveInteraction();
            flushMetadataSaves().catch(console.error);
        });
    </script>
</body>
</html>
