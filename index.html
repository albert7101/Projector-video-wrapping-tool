<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projector Media Canvas (Lite)</title>
    <style>
        :root { --bg: #000; --accent: #f59e0b; --zinc-900: #18181b; --zinc-800: #27272a; --zinc-700: #3f3f46; --zinc-400: #a1a1aa; }
        body { background: var(--bg); margin: 0; overflow: hidden; color: white; font-family: system-ui, -apple-system, sans-serif; user-select: none; -webkit-user-select: none; }
        #canvas { position: relative; width: 100vw; height: 100vh; }
        .media-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .media-content { width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .media-container:hover .overlay { opacity: 1; pointer-events: auto; }
        .handle { position: absolute; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: crosshair; transform: translate(-50%, -50%); z-index: 100; opacity: 0; transition: opacity 0.2s; }
        .handle::after { content: ''; width: 12px; height: 12px; background: white; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: transform 0.2s; }
        .handle:hover::after, .handle.active::after { transform: scale(1.5); background: var(--accent); border-color: var(--accent); }
        .media-container:hover ~ .handle, .handle.active { opacity: 1; }
        
        #toolbar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(24,24,27,0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--zinc-800); padding: 12px; border-radius: 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 1000; transition: transform 0.3s, opacity 0.3s; }
        #toolbar.hidden { transform: translate(-50%, 100px); opacity: 0; }
        
        .btn { background: var(--zinc-800); color: var(--zinc-400); border: none; padding: 12px; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn:hover { color: white; background: var(--zinc-700); }
        .btn:active { transform: scale(0.9); }
        .btn-primary { background: white; color: black; font-weight: bold; padding: 12px 20px; gap: 8px; }
        .btn-primary:hover { background: #e4e4e7; }
        .btn.active { background: var(--accent); color: black; }
        
        .divider { width: 1px; height: 30px; background: var(--zinc-700); margin: 0 4px; }
        .stats { display: flex; flex-direction: column; align-items: center; padding: 0 8px; }
        .stats-label { font-size: 9px; text-transform: uppercase; color: var(--zinc-700); font-weight: 900; letter-spacing: 1px; }
        .stats-val { font-size: 18px; font-weight: bold; font-family: monospace; }
        
        #empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--zinc-700); pointer-events: none; text-align: center; }
        .upload-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--zinc-900); border: 1px solid var(--zinc-800); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        
        .control-btn { padding: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; color: white; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.2s; }
        .control-btn:hover { background: rgba(255,255,255,0.2); }
        .action-btn { padding: 10px 20px; background: var(--zinc-800); border: 1px solid var(--zinc-700); border-radius: 12px; color: white; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .action-btn:hover { background: var(--zinc-700); }
        .action-btn.danger { background: rgba(220,38,38,0.8); border-color: #dc2626; }
    </style>
</head>
<body>
    <div id="canvas"></div>
    
    <div id="empty-state">
        <div class="upload-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <h2 style="margin:0; color: #d4d4d8;">Projector Media Canvas (Lite)</h2>
        <p style="font-size: 14px; opacity: 0.5;">Click anywhere to toggle tools. Optimized for performance.</p>
    </div>

    <div id="toolbar">
        <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            ADD MEDIA
        </button>
        <div class="divider"></div>
        <button id="lock-btn" class="btn" title="Lock Layout">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </button>
        <button class="btn" onclick="clearAll()" title="Clear All">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
        <button id="fs-btn" class="btn" title="Toggle Fullscreen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <div class="divider"></div>
        <div class="stats">
            <span class="stats-label">Active</span>
            <span id="count" class="stats-val">0</span>
        </div>
    </div>

    <input type="file" id="file-input" hidden multiple accept="video/mp4,image/*">

    <script>
        // --- State ---
        let videos = [];
        let isLocked = false;
        let activeHandle = null; // { videoId, cornerIndex }
        let activeBody = null; // videoId
        let dragData = null;
        let nextZIndex = 1;

        const canvas = document.getElementById('canvas');
        const toolbar = document.getElementById('toolbar');
        const countEl = document.getElementById('count');
        const lockBtn = document.getElementById('lock-btn');
        const emptyState = document.getElementById('empty-state');

        // --- DB ---
        const DB_NAME = 'ProjectorCanvasDB_Lite';
        const STORE_NAME = 'media';

        const initDB = () => new Promise((res, rej) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
            req.onsuccess = e => res(e.target.result);
            req.onerror = e => rej(e.target.error);
        });

        const saveToDB = async v => {
            const db = await initDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const { url, ...data } = v;
            tx.objectStore(STORE_NAME).put(data);
        };

        const deleteFromDB = async id => {
            const db = await initDB();
            db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).delete(id);
        };

        // --- Math ---
        function getPerspectiveTransform(src, dst) {
            const p1 = src, p2 = dst;
            const a = [
                [p1[0].x, p1[0].y, 1, 0, 0, 0, -p2[0].x * p1[0].x, -p2[0].x * p1[0].y],
                [0, 0, 0, p1[0].x, p1[0].y, 1, -p2[0].y * p1[0].x, -p2[0].y * p1[0].y],
                [p1[1].x, p1[1].y, 1, 0, 0, 0, -p2[1].x * p1[1].x, -p2[1].x * p1[1].y],
                [0, 0, 0, p1[1].x, p1[1].y, 1, -p2[1].y * p1[1].x, -p2[1].y * p1[1].y],
                [p1[2].x, p1[2].y, 1, 0, 0, 0, -p2[2].x * p1[2].x, -p2[2].x * p1[2].y],
                [0, 0, 0, p1[2].x, p1[2].y, 1, -p2[2].y * p1[2].x, -p2[2].y * p1[2].y],
                [p1[3].x, p1[3].y, 1, 0, 0, 0, -p2[3].x * p1[3].x, -p2[3].x * p1[3].y],
                [0, 0, 0, p1[3].x, p1[3].y, 1, -p2[3].y * p1[3].x, -p2[3].y * p1[3].y]
            ];
            const b = [p2[0].x, p2[0].y, p2[1].x, p2[1].y, p2[2].x, p2[2].y, p2[3].x, p2[3].y];
            const n = 8;
            for (let i = 0; i < n; i++) {
                let max = i;
                for (let j = i + 1; j < n; j++) if (Math.abs(a[j][i]) > Math.abs(a[max][i])) max = j;
                [a[i], a[max]] = [a[max], a[i]]; [b[i], b[max]] = [b[max], b[i]];
                for (let j = i + 1; j < n; j++) {
                    const c = a[j][i] / a[i][i];
                    for (let k = i; k < n; k++) a[j][k] -= c * a[i][k];
                    b[j] -= c * b[i];
                }
            }
            const x = new Array(n);
            for (let i = n - 1; i >= 0; i--) {
                let sum = 0;
                for (let j = i + 1; j < n; j++) sum += a[i][j] * x[j];
                x[i] = (b[i] - sum) / a[i][i];
            }
            return [x[0], x[3], 0, x[6], x[1], x[4], 0, x[7], 0, 0, 1, 0, x[2], x[5], 0, 1];
        }

        // --- Rendering ---
        function updateMediaStyles(v) {
            const el = document.getElementById(`container-${v.id}`);
            if (!el) return;
            const srcPoints = [{x:0,y:0}, {x:v.w,y:0}, {x:v.w,y:v.h}, {x:0,y:v.h}];
            const m = getPerspectiveTransform(srcPoints, v.corners);
            const matrix = `matrix3d(${m.join(',')})`;
            el.style.transform = matrix;
            el.style.webkitTransform = matrix;
            el.style.zIndex = v.zIndex;
            
            v.corners.forEach((p, i) => {
                const h = document.getElementById(`handle-${v.id}-${i}`);
                if (h) { h.style.left = p.x + 'px'; h.style.top = p.y + 'px'; h.style.zIndex = v.zIndex + 1; }
            });
        }

        function createMediaElement(v) {
            const container = document.createElement('div');
            container.id = `container-${v.id}`;
            container.className = 'media-container';
            container.style.width = v.w + 'px';
            container.style.height = v.h + 'px';
            
            const content = document.createElement(v.type === 'video' ? 'video' : 'img');
            content.src = v.url;
            content.className = 'media-content';
            if (v.type === 'video') { content.loop = true; content.muted = v.isMuted; content.playsInline = true; if (!v.isPaused) content.play(); }
            
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            
            const controls = document.createElement('div');
            controls.style.display = 'flex';
            controls.style.gap = '20px';
            
            if (v.type === 'video') {
                const playBtn = document.createElement('button');
                playBtn.className = 'control-btn';
                playBtn.innerHTML = v.isPaused ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>' : '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
                playBtn.onclick = e => { e.stopPropagation(); v.isPaused = !v.isPaused; v.isPaused ? content.pause() : content.play(); playBtn.innerHTML = v.isPaused ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>' : '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'; saveToDB(v); };
                
                const muteBtn = document.createElement('button');
                muteBtn.className = 'control-btn';
                muteBtn.innerHTML = v.isMuted ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>' : '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
                muteBtn.onclick = e => { e.stopPropagation(); v.isMuted = !v.isMuted; content.muted = v.isMuted; muteBtn.innerHTML = v.isMuted ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>' : '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>'; saveToDB(v); };
                
                controls.append(playBtn, muteBtn);
            }
            
            const actions = document.createElement('div');
            actions.style.display = 'flex';
            actions.style.gap = '10px';
            
            const resetBtn = document.createElement('button');
            resetBtn.className = 'action-btn';
            resetBtn.innerHTML = 'RESET';
            resetBtn.onclick = e => { 
                e.stopPropagation(); 
                const aspectRatio = v.w / v.h;
                let targetW = window.innerWidth / 4;
                let targetH = targetW / aspectRatio;
                if (targetH > window.innerHeight / 4) {
                    targetH = window.innerHeight / 4;
                    targetW = targetH * aspectRatio;
                }
                const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
                const sw = targetW / 2, sh = targetH / 2;
                v.corners = [
                    { x: cx - sw, y: cy - sh },
                    { x: cx + sw, y: cy - sh },
                    { x: cx + sw, y: cy + sh },
                    { x: cx - sw, y: cy + sh }
                ];
                updateMediaStyles(v); 
                saveToDB(v); 
            };
            
            const delBtn = document.createElement('button');
            delBtn.className = 'action-btn danger';
            delBtn.innerHTML = 'REMOVE';
            delBtn.onclick = e => { e.stopPropagation(); container.remove(); v.corners.forEach((_,i)=>document.getElementById(`handle-${v.id}-${i}`).remove()); videos = videos.filter(x=>x.id!==v.id); deleteFromDB(v.id); updateCount(); };
            
            actions.append(resetBtn, delBtn);
            overlay.append(controls, actions);
            container.append(content, overlay);
            
            container.onmousedown = container.ontouchstart = e => {
                if (isLocked) return;
                e.stopPropagation();
                v.zIndex = nextZIndex++;
                updateMediaStyles(v);
                if (activeHandle) { document.getElementById(`handle-${activeHandle.videoId}-${activeHandle.cornerIndex}`).classList.remove('active'); activeHandle = null; }
                if (activeBody === v.id) { activeBody = null; dragData = null; }
                else {
                    activeBody = v.id;
                    const p = e.touches ? e.touches[0] : e;
                    dragData = { startX: p.clientX, startY: p.clientY, initialCorners: v.corners.map(c => ({...c})) };
                }
            };
            
            canvas.appendChild(container);
            
            v.corners.forEach((p, i) => {
                const h = document.createElement('div');
                h.id = `handle-${v.id}-${i}`;
                h.className = 'handle';
                h.onmousedown = h.ontouchstart = e => {
                    if (isLocked) return;
                    e.stopPropagation();
                    v.zIndex = nextZIndex++;
                    updateMediaStyles(v);
                    if (activeBody) activeBody = null;
                    if (activeHandle && activeHandle.videoId === v.id && activeHandle.cornerIndex === i) {
                        h.classList.remove('active'); activeHandle = null;
                    } else {
                        if (activeHandle) document.getElementById(`handle-${activeHandle.videoId}-${activeHandle.cornerIndex}`).classList.remove('active');
                        activeHandle = { videoId: v.id, cornerIndex: i };
                        h.classList.add('active');
                    }
                };
                canvas.appendChild(h);
            });
            
            updateMediaStyles(v);
        }

        // --- Interactions ---
        window.onmousemove = window.ontouchmove = e => {
            if (isLocked) return;
            const p = e.touches ? e.touches[0] : e;
            if (activeHandle) {
                const v = videos.find(x => x.id === activeHandle.videoId);
                v.corners[activeHandle.cornerIndex] = { x: p.clientX, y: p.clientY };
                updateMediaStyles(v);
            } else if (activeBody && dragData) {
                const v = videos.find(x => x.id === activeBody);
                const dx = p.clientX - dragData.startX;
                const dy = p.clientY - dragData.startY;
                v.corners = dragData.initialCorners.map(c => ({ x: c.x + dx, y: c.y + dy }));
                updateMediaStyles(v);
            }
        };

        window.onmouseup = window.ontouchend = () => {
            if (activeHandle) saveToDB(videos.find(x => x.id === activeHandle.videoId));
            if (activeBody) saveToDB(videos.find(x => x.id === activeBody));
        };

        document.body.onclick = () => toolbar.classList.toggle('hidden');
        toolbar.onclick = e => e.stopPropagation();

        function updateCount() {
            countEl.innerText = videos.length;
            emptyState.style.display = videos.length ? 'none' : 'flex';
        }

        function clearAll() {
            if (!confirm('Clear all?')) return;
            videos.forEach(v => {
                document.getElementById(`container-${v.id}`).remove();
                v.corners.forEach((_,i) => document.getElementById(`handle-${v.id}-${i}`).remove());
            });
            videos = [];
            initDB().then(db => db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).clear());
            updateCount();
        }

        lockBtn.onclick = () => { isLocked = !isLocked; lockBtn.classList.toggle('active', isLocked); };

        document.getElementById('fs-btn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        // --- File Handling ---
        document.getElementById('file-input').onchange = e => {
            Array.from(e.target.files).forEach(file => {
                const isVideo = file.type.startsWith('video/');
                const el = document.createElement(isVideo ? 'video' : 'img');
                const url = URL.createObjectURL(file);
                const onLoaded = () => {
                    const w = isVideo ? el.videoWidth : el.naturalWidth;
                    const h = isVideo ? el.videoHeight : el.naturalHeight;
                    
                    // Initial size: quarter of the screen width, maintaining aspect ratio
                    const aspectRatio = w / h;
                    let targetW = window.innerWidth / 4;
                    let targetH = targetW / aspectRatio;
                    
                    // Ensure it's not too tall for the screen
                    if (targetH > window.innerHeight / 4) {
                        targetH = window.innerHeight / 4;
                        targetW = targetH * aspectRatio;
                    }

                    const cx = window.innerWidth / 2;
                    const cy = window.innerHeight / 2;
                    const sw = targetW / 2;
                    const sh = targetH / 2;

                    const v = {
                        id: Math.random().toString(36).substr(2,9),
                        type: isVideo ? 'video' : 'image',
                        fileBlob: file,
                        corners: [
                            { x: cx - sw, y: cy - sh },
                            { x: cx + sw, y: cy - sh },
                            { x: cx + sw, y: cy + sh },
                            { x: cx - sw, y: cy + sh }
                        ],
                        zIndex: nextZIndex++,
                        isPaused: false,
                        isMuted: true,
                        w, h, url
                    };
                    videos.push(v);
                    createMediaElement(v);
                    saveToDB(v);
                    updateCount();
                };
                if (isVideo) { el.onloadedmetadata = onLoaded; el.src = url; }
                else { el.onload = onLoaded; el.src = url; }
            });
        };

        // --- Init ---
        (async () => {
            const db = await initDB();
            const saved = await new Promise(res => {
                const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
                req.onsuccess = () => res(req.result);
            });
            saved.forEach(v => {
                v.url = URL.createObjectURL(v.fileBlob);
                videos.push(v);
                createMediaElement(v);
                if (v.zIndex >= nextZIndex) nextZIndex = v.zIndex + 1;
            });
            updateCount();
        })();
    </script>
</body>
</html>
